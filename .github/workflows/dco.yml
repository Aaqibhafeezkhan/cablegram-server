name: DCO

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git show -s --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit ${commit:0:7} is not signed off. Use 'git commit -s' (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit "$missing"
