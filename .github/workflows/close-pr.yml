name: Close Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Thank you for your interest in Cablegram Community Server!\n\nAs explained in [CONTRIBUTING.md](CONTRIBUTING.md), this repository is an automated one-way mirror from the core Cablegram monorepo. Because changes pushed here are overwritten by the export pipeline, **pull requests are not accepted at this time**.\n\nPlease open a [GitHub Issue](https://github.com/seep-labs/cablegram-server/issues) instead to describe the bug or feature request so we can review and address it in the upstream core.'
            });
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed'
            });
